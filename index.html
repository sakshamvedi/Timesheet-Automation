<!DOCTYPE html>
<html>
<head>
    <title>Smart Timesheet Tracker</title>
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .activity-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .activity-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<h2>Activity Tracker</h2>
<div class="activity-list" id="activityList"></div>
<div class="controls">
    <button id="exportTimesheet">Export Timesheet</button>
    <button id="clearData">Clear Data</button>
</div>
<script src="popup.js"></script>
</body>
</html>
